
# The ${...} variables are interpolated from the .env file in this folder.
# Always invoke with the explicit file: docker compose --env-file .env ...
services:
  mongo:
    image: mongo:7.0.5-jammy
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-aigdai-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env (ver .env.example)}
    volumes:
      - './mongo-data:/data/db'
    ports:
      - 27017:27017
