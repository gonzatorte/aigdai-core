
# Las variables ${...} se interpolan desde el archivo .env de esta carpeta.
# Invocar siempre con el archivo explícito: docker compose --env-file .env ...
services:
  mongo:
    image: mongo:7.0.5-jammy
    restart: no
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-aigdai-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?definir MONGO_PASSWORD en .env (ver .env.example)}
    volumes:
      - './mongo-data:/data/db'
    ports:
      - 27017:27017
