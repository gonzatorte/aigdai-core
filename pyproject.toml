[project]
name = "aigdai-core"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "httpx",
    "jpype1",
    "lxml",
    "matplotlib",
    "motor",
    "owlready2",
    "pandas",
    "pymongo",
    "python-dotenv",
    "rdflib",
    "requests",
    "seaborn",
    "xmlschema",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]


[tool.pytest.ini_options]
# The defaults plus the Docker data volumes, which are not readable by the user
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "fuseki-data", "mongo-data", "postgres-data"]
