
# Las variables ${...} se interpolan desde el archivo .env de esta carpeta.
# Invocar siempre con el archivo explícito: docker compose --env-file .env -f docker-compose-jena.yml ...
services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    container_name: st_fuseki
    restart: no
    environment:
#      FUSEKI_DATASET_1: /opt/ontop/input/aigdai.ttl
#      FUSEKI_DATASET_2: /opt/ontop/input/aigdai.ttl
#      JVM_ARGS: "-Xmx2g"
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?definir FUSEKI_ADMIN_PASSWORD en .env (ver .env.example)}
#      TDB: 2
    volumes:
      - ./fuseki-data:/fuseki
#      - ./fuseki-config:/fuseki/configuration
    ports:
      - "3030:3030"
